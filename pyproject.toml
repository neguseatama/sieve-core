[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve-core-engine"
version = "1.2.0"
description = "Core logic and base components for the Sieve ecosystem"
readme = "README.md"
authors = [
    { name = "Kai IWASAKI" }
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
"Bug Tracker" = "https://github.com/neguseatama/sieve-core/issues"
Homepage = "https://github.com/neguseatama/sieve-core"
Repository = "https://github.com/neguseatama/sieve-core.git"

[tool.setuptools]
py-modules = ["sieve_core"]
